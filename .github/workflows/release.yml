# Builds Windows EXE and attaches it to GitHub Releases so anyone can download it.
# Trigger: push a version tag (e.g. v2.1.0), or run workflow manually (artifact only).
name: Release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Set EXE output name
        id: meta
        shell: pwsh
        run: |
          $ref = $env:GITHUB_REF
          if ($ref -match '^refs/tags/v') {
            $tag = $ref -replace '^refs/tags/',''
            $exe = "NITROTOOLS_PUBG_MOBILE_$tag"
            echo "exe_name=$exe" >> $env:GITHUB_OUTPUT
            echo "is_release=true" >> $env:GITHUB_OUTPUT
          } else {
            $line = Select-String -Path main.py -Pattern 'APP_VERSION = "([^"]+)"'
            $v = $line.Matches.Groups[1].Value
            $exe = "NITROTOOLS_PUBG_MOBILE_$v"
            echo "exe_name=$exe" >> $env:GITHUB_OUTPUT
            echo "is_release=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build with PyInstaller
        env:
          PYINSTALLER_EXE_NAME: ${{ steps.meta.outputs.exe_name }}
        run: python -m PyInstaller --noconfirm --clean NITROTOOLS_RELEASE.spec

      - name: Attach EXE to GitHub Release (tag pushes only)
        if: steps.meta.outputs.is_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ steps.meta.outputs.exe_name }}.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifact (manual workflow only)
        if: steps.meta.outputs.is_release == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: nitrotools-exe
          path: dist/${{ steps.meta.outputs.exe_name }}.exe
